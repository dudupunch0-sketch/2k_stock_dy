name: Collect requested public filings
on:
  push:
    branches: [main]
    paths: ["requests/*.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stockdy-collection-${{ github.ref }}
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate requests and collect public filings
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python -m stockdy.workflow
      - name: Save collection result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data requests
          if ! git diff --cached --quiet; then
            git commit -m "chore: collect requested public filings"
            branch="${GITHUB_REF_NAME}"
            for attempt in 1 2 3; do
              git fetch origin "${branch}:refs/remotes/origin/${branch}"
              if ! git rebase "origin/${branch}"; then
                git rebase --abort || true
                echo "::error::Collection result conflicts with a newer branch commit; resolve manually and rerun the request."
                exit 1
              fi
              if git push origin "HEAD:refs/heads/${branch}"; then
                exit 0
              fi
              if [ "${attempt}" -eq 3 ]; then
                echo "::error::Could not save collection result after three push attempts. Rerun the request after checking branch state."
                exit 1
              fi
              echo "Push raced with another commit; retrying after fetch and rebase (${attempt}/3)."
            done
          fi
