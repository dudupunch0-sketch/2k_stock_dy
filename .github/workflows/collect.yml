name: Collect requested public filings
on:
  push:
    branches: [main]
    paths: ["requests/*.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stockdy-collection-${{ github.ref }}
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate requests and collect public filings
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python -m stockdy.workflow
      - name: Save collection result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data requests
          if ! git diff --cached --quiet; then
            git commit -m "chore: collect requested public filings"
            git push
          fi
